<!DOCTYPE html>
<html>
    <head>
        <title> Guess a Number </title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Tiny5+Duo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Rum+Raisin&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>Guess the Number!</h1>
            <h2><i>Guess a number between 1 and 99 in seven attempts!</i></h2>
            <h3>Wins: <span id = "wins"></span> Losses: <span id = "losses"></span></h3>
        </header>
        <br>
        <div id="main">
          <strong>Attempts Remaining: <span id = "tries"></span> </strong>
          <br> 
          Enter a guess: 
          <input type="text" id="playerGuess" size="5">         
          <button id="guessBtn"> Guess </button> <br>
          <button id="resetBtn"> Reset </button>
          <div id="feedback"></div> 
          <div> Previous Guesses:
            <span id ="guesses"></span>
          </div>
        </div>

        <script src="js/script.js"></script>

        <footer>
            <p>&copy; 2026 Diego Borjas. All rights reserved.</p>
            <p>This site is for academic purposes only.</p>
            <p>CST 336 Internet Programming.</p>
            <img src="img/csumb-logo.jpg" alt="CSUMB logo" width="300">
        </footer>

    </body>
</html>
